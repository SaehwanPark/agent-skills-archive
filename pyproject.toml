[project]
name = "saehwan-agent-skills"
version = "0.1.0"
description = "Reusable agent skills and deployment tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
deploy-skills = "agent_skills_archive.deploy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_skills_archive"]
